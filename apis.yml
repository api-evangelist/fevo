apis:
- aid: fevo:order-api
  name: FEVO Order API
  description: 'A data-feed API that returns every field in the FEVO Sales Report —
    orders and order adjustments — so a customer can pull FEVO transaction data directly
    into their own data warehouse. Queries run by Order Date or Event Date. Access
    requires a User ID and Access Key issued per team by a FEVO representative; the
    endpoint definitions document is distributed as a Salesforce content-delivery page
    linked from the Help Center. No public reference, no machine-readable spec.'
  humanURL: https://intercom.help/fevoenterprise/en/articles/8912590-api-faqs
  x-base-url: unpublished
  x-base-url-note: 'FEVO names no host for the Order API on any public page. The endpoint
    definitions are linked only to a Salesforce content-delivery URL that requires JavaScript
    to view (probed 2026-08-12: HTTP 200, 1,359-byte contentDistribution shell, x-robots-tag
    noindex). api.fevo.com and api.gofevo.com do not resolve. Recorded as missing rather than
    guessed from the domain.'
  tags:
  - Orders
  - Reporting
  - Data Feed
