- aid: fevo:embedded-checkout
  name: FEVO Embedded Checkout (Distributed Commerce Button)
  description: 'The client-side embed surface. A single script tag loads GMWidget from
    gofevo.com (or gofevo.uk for the UK), and GMWidget.open(''offerSlug'') opens the
    FEVO Social Checkout drawer over the partner''s own page for the named offer. The
    embedding domain must be allow-listed by FEVO before the drawer will render.'
  humanURL: https://intercom.help/fevoenterprise/en/articles/8986183-distributed-commerce-button
