x-contract-note: 'FEVO publishes no machine-readable contract. Full STEP 0b discovery was run
  on 2026-08-12 against every host: /openapi.json, /openapi.yaml, /swagger.json, /api-docs,
  /docs and /redoc on www.fevo.com, www.gofevo.com, report.gofevo.com and fevo-enterprise.com
  (all 404); /graphql (404); /.well-known/{security.txt,openid-configuration,oauth-authorization-server,api-catalog,ai-plugin.json,agent-card.json,agent.json}
  on every host (all 404); /llms.txt (404). api.fevo.com and api.gofevo.com do not resolve.
  No MCP server, no A2A agent card, no AsyncAPI, no webhook catalog, no Postman collection.
  The GitHub org github.com/fevo-tech holds 11 repos, every one a fork. The Order API''s own
  definitions document is a Salesforce content-delivery page that requires JavaScript, and
  access requires credentials issued by a FEVO representative. Separately, the entire legacy
  Fevo.js stack — https://www.fevo.com/docs/v1, https://www.fevo.com/api/v1 and
  https://sdk.fevo.com/v1/fevo.js — returned HTTP 502 with CloudFront reporting it could not
  resolve the origin domain name, with no deprecation notice ever published.'
