aid: fevo
name: Fevo
description: 'FEVO is a New York social-commerce and group-ticketing platform, launched
  in 2016, that lets fans buy, split and share orders for live events together. Its
  Social Checkout drawer and Distributed Commerce Button embed into a client''s own
  site, sitting in front of existing ticketing and inventory systems, while the FEVO
  Enterprise console at gofevo.com handles offer creation, gating, discounting, payouts
  and reporting. The developer surface is deliberately narrow: a client-side JavaScript
  widget (GMWidget) any partner can embed, and an Order API data feed that pushes
  FEVO Sales Report fields into a customer data warehouse using a User ID and Access
  Key issued by a FEVO representative. FEVO reports 800+ brands in sports, music and
  entertainment and more than 24 million tickets sold.'
