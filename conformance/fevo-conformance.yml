  - id: pci-dss
    name: PCI DSS
    conforms: unknown
    evidence: >-
      FEVO makes no PCI statement. Observed on a live offer page: card entry is delegated
      to Braintree hosted fields (with 3-D Secure) and Shift4, plus Apple Pay and Google Pay,
