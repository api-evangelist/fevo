      inference about architecture, not a certification claim, and is recorded as unknown.

  - id: ccpa
    name: 'CCPA / California privacy'
    conforms: true
    evidence: >-
      FEVO publishes a CCPA Notice, a "Do Not Sell My Personal Information" page
