  from, so every `conforms: false` below is a recorded absence rather than a failed
  validation.

standards:

  - id: openapi
    name: OpenAPI Specification
    conforms: false
    evidence: >-
      No spec at any probed location. /openapi.json, /swagger.json, /api-docs and /docs
      were probed on www.fevo.com, www.gofevo.com, report.gofevo.com and
      fevo-enterprise.com — all 404, except the legacy /api/v1 path on www.fevo.com which
      returns 502. api.fevo.com and api.gofevo.com do not resolve.

  - id: asyncapi
    name: AsyncAPI
    conforms: false
    evidence: >-
      No event, streaming or webhook surface is documented anywhere in the Help Center or
      on the marketing site. FEVO's data-out mechanism is a pull-based Order API, not a push.

  - id: graphql
    name: GraphQL
    conforms: false
    evidence: >-
      /graphql probed on www.gofevo.com and fevo-enterprise.com — 404. FEVO does publish
      forks of graphql-code-generator under its @fevo-tech npm scope, so GraphQL is used
      internally, but no endpoint is exposed publicly.

  - id: rfc9457
    name: 'RFC 9457: Problem Details for HTTP APIs'
    conforms: false
    evidence: >-
      No error envelope of any kind is published. The one documented error is a bare 502
