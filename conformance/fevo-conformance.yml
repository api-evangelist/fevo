  - id: rfc9116
    name: 'RFC 9116: security.txt'
    conforms: false
    evidence: 404 on /.well-known/security.txt across all four FEVO hosts probed 2026-08-12.

  - id: rfc8594
    name: 'RFC 8594: Sunset HTTP Header'
    conforms: false
    evidence: No deprecation or sunset signaling is published. See lifecycle/fevo-lifecycle.yml.

  - id: idempotency
    name: Idempotent request keys
    conforms: false
    evidence: No idempotency key or retry-safety guidance in any FEVO documentation.

  - id: pagination
    name: Documented pagination
    conforms: false
