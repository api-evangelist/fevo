source: >-
  npm registry (registry.npmjs.org search + metadata for the @fevo-tech scope, maintainer
  "fevo"), plus the two first-party browser bundles FEVO documents in its Help Center:
  https://intercom.help/fevoenterprise/en/articles/8986183-distributed-commerce-button
  and the Fevo.js Button SDK documented at https://www.fevo.com/docs/v1
note: >-
  FEVO ships no server-side client library in any language registry. Its only client
  SDKs are browser bundles delivered from its own CDN hosts, so they have no registry
  metadata endpoint to query — version/published are read from (or absent in) the URL
  itself, per the pipeline's CDN rule. The @fevo-tech npm scope is genuinely FEVO's
  (npm maintainer "fevo") but publishes internal build tooling — forks of
  graphql-code-generator and of the `obscenity` profanity filter — not API clients.
  Registries probed with no first-party result: PyPI (fevo -> 404), pkg.go.dev,
  RubyGems, Packagist, crates.io, NuGet, Maven Central.

